services:
  frontend:
    image: exampl-frontend:latest
    environment:
       - REACT_APP_BACKEND_URL=http://backend/api
    # ports:
      # - "5001:5001"
    restart: unless-stopped

  backend:
    image: exampl-backend:latest
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis         # see the redis service below
      REDIS_PORT: 6379
      POSTGRES_HOST: db         # see the db service below
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DATABASE: postgres
    restart: unless-stopped
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    ports:
      - "6379" # Optional: Exposes internally, but keeps it closed to the
               # outside world
    restart: unless-stopped

  db:
    image: postgres:18
    restart: unless-stopped
     # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql

  nginx:
    image: nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
