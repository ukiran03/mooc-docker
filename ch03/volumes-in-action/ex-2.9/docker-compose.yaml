services:
  frontend:
    # build:
      # context: ./example-frontend/
      # dockerfile: Dockerfile.frontend
    image: exampl-frontend:v2   # same as above
    expose:
      - "5001"
    restart: unless-stopped

  backend:
    image: exampl-backend:latest
    expose:
      - "8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DATABASE: postgres
    restart: unless-stopped
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    restart: unless-stopped

  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  db_data:
