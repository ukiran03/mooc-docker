services:
  frontend:
    image: exampl-frontend:latest
    ports:
      - "5001:5001"
    restart: unless-stopped

  backend:
    image: exampl-backend:latest
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379" # Optional: Exposes internally, but keeps it closed to the
               # outside world
    restart: unless-stopped
